[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kedarmusic"
version = "2.0.0"
description = "A FastAPI service and clients for JioSaavn music discovery, streaming, and downloads."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Kedar Damale" }]
dependencies = [
  "fastapi>=0.112,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "requests>=2.32,<3.0",
  "pyDes>=2.0.1,<3.0",
  "Jinja2>=3.1,<4.0",
  "mutagen>=1.47,<2.0",
  "pydub>=0.25,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["main", "jiosaavn_client"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["F"]

[tool.setuptools]
py-modules = ["main", "jiosaavn_client", "endpoints"]
